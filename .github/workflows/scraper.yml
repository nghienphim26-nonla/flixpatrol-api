name: Auto Scrape FlixPatrol

on:
  schedule:
    # Lịch chạy tự động mỗi ngày vào lúc 7 giờ sáng (Giờ UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công bất cứ lúc nào trên giao diện GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    # Cấp quyền cho GitHub Actions có thể ghi và đẩy file lên Repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4

      - name: Run Python script
        run: python scraper.py

      - name: Commit and push JSON results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add flixpatrol_netflix_vn.json
          # Kiểm tra nếu file có thay đổi thì mới tiến hành commit và push lên repo
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FlixPatrol data JSON [skip ci]" && git push)
